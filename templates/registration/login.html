{% extends "base.html" %}

{% block title %}Iniciar sesión · Gym Control{% endblock %}

{% block content %}
<div class="card login-card mx-auto">
    <div class="card-body">
        <h1 class="h4 mb-3 text-center">Iniciar sesión</h1>

        {% if form.non_field_errors %}
            <div class="alert alert-danger" role="alert">
                {{ form.non_field_errors.0 }}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="{{ form.username.id_for_label }}" class="form-label fw-semibold">Usuario</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label for="{{ form.password.id_for_label }}" class="form-label fw-semibold">Contraseña</label>
                {{ form.password }}
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary btn-lg w-100">Iniciar sesión</button>
        </form>
    </div>
</div>
{% endblock %}
